
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TriPro ERP</title>
    <link rel="icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TriPro ERP" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <!-- ✅ Google Fonts غير مُعيق: يُحمَّل بشكل async ولا يوقف التطبيق -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet"></noscript>
    <style>
      /* ✅ خط احتياطي محلي يعمل بدون إنترنت */
      body, * { font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // ✅ Electron detection via userAgent (works with contextIsolation:true)
    const isElectron = navigator.userAgent.toLowerCase().includes('electron');
    if (!isElectron && 'serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
