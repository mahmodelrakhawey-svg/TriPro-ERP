name: Supabase Migration Verification & Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'sql_updates/**'
      - 'scripts/db_migrate.mjs'
  workflow_dispatch:

jobs:
  verify-migrations:
    name: Verify Migration Integrity & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DB Migration Engine Tests
        run: npx vitest run tests/db_migration_engine.test.ts

      - name: Verify SQL Security Audit
        run: npm run security-audit

  check-remote-status:
    name: Check Remote Migration Status (Lenza & General)
    needs: verify-migrations
    runs-on: ubuntu-latest
    if: ${{ secrets.LENZA_SUPABASE_URL != '' && secrets.GENERAL_SUPABASE_URL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Lenza DB Status
        env:
          VITE_SUPABASE_URL: ${{ secrets.LENZA_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.LENZA_SUPABASE_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_KEY=$VITE_SUPABASE_KEY" >> .env
          npm run db:status

      - name: Check General DB Status
        env:
          VITE_SUPABASE_URL: ${{ secrets.GENERAL_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.GENERAL_SUPABASE_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_KEY=$VITE_SUPABASE_KEY" >> .env
          npm run db:status
